x-domain-note: >-
  may-sante.com (the URL Serena's portfolio profile lists) 301-redirects to
  https://www.may.app/, which is the canonical marketing host and the one every probe in
  this profile was run against. Both domains are the company's own. The legal operating
  entity is LN CARE SAS, 112 avenue de Paris, 94306 Vincennes, France (R.C.S. Créteil
  879 732 584); contact@may-sante.com.
x-source-classification-note: >-
  Serena's own portfolio profile tags May as `edtech` (with `healthtech` secondary), which
  is how the original stub arrived carrying an Edtech tag. The company's product is a
  regulated-adjacent consumer health service — medical messaging with qualified perinatal
  clinicians and health-data hosting on an HDS-certified host — so the tags here are set to
  digital health / parenting rather than education technology.
