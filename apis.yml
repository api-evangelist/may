description: 'May is a French digital-health company, operated by LN CARE SAS, whose mobile
  app supports future and new parents from fertility and pregnancy through the first years
  of a child''s life. It pairs a medical messaging service staffed by French-qualified
  midwives, pediatric nurses and doctors — answering questions seven days a week from 8am
  to 10pm — with an expert-reviewed content library, roughly hour-long audio masterclasses,
  everyday tracking tools for sleep, feeding and weight, and Mya, an in-app AI medical
  assistant. Founded in Paris in 2020 by Cécilia Creuzet, Antoine Creuzet and Adrien Brunet,
  it reported more than 400,000 users and a team of around 80 health professionals, raised
  €7M in September 2024 to expand into Spain and the United Kingdom, and also sells a
  parental-support benefit to employers. It was surfaced as a portfolio company of Serena
  and profiled in the API Evangelist network; it publishes a consumer marketing site, a blog
  and an Intercom help center, but no public developer program, no API reference and no
  machine-readable API contract of any kind.'
