- host: capig.may.app
  https: false
  note: >-
    DANGLING CNAME. Found in certificate-transparency logs. Resolves to
    k8s-cloudbridgeingres-9547b3803a-310062026.eu-west-3.elb.amazonaws.com, an AWS
