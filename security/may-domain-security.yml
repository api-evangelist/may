source: live DNS/TLS/HTTP probes of apis.yml hosts + certificate-transparency subdomains
note: >-
  May publishes no API, so there is no baseURL and no OpenAPI servers[] host to probe. The
  hosts below are the canonical marketing host, the legacy brand domain that redirects to
  it, and the two additional subdomains found in certificate-transparency logs (crt.sh) for
  *.may.app. Everything sits behind Cloudflare. Neither registrable domain serves HSTS,
  publishes a CAA record, or is DNSSEC-signed; both publish SPF and a DMARC record at
  p=quarantine with pct=90 and sp=none, so subdomain mail is unprotected and 10% of failing
  mail on the organizational domain is still delivered unquarantined. Absence of a record
  here is observed data, not a gap in the probe.
